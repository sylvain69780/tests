<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="UTF-8">
	<title>Dodécaèdre Three.js</title>
	<style>
		html,
		body {
			margin: 0;
			overflow: hidden;
			height: 100%;
			background: #000000;
		}

		canvas {
			display: block;
		}
	</style>
</head>

<body>
	<div id="vignette"
		style="position: fixed; inset: 0; pointer-events: none; z-index: 5; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,10,30,0.8) 100%);">
	</div>
	<button id="rotationToggle"
		style="position: fixed; top: 12px; left: 12px; z-index: 10; padding: 8px 14px; background: #55d6be; color: #0a0a0a; border: none; border-radius: 4px; font-family: sans-serif; cursor: pointer;">
		Arrêter la rotation
	</button>
	<button id="colorModeToggle"
		style="position: fixed; top: 52px; left: 12px; z-index: 10; padding: 8px 14px; background: #4488ff; color: #ffffff; border: none; border-radius: 4px; font-family: sans-serif; cursor: pointer;">
		Couleurs : Or
	</button>
	<script type="module" src="/main.js"></script>
</body>

</html>
